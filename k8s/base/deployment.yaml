apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/b-gaspard/devops-project:27e24e557d56da0c50ac8cbfe8185fe2ed0e33f9
          ports:
            - containerPort: 3000