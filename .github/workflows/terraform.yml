name: terraform

on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize dev
        run: terraform -chdir=infra/envs/dev init -backend=false

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate dev
        run: terraform -chdir=infra/envs/dev validate

      - name: Create plan
        run: terraform -chdir=infra/envs/dev plan -var-file=dev.tfvars -input=false -no-color -out=tfplan | tee tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            infra/envs/dev/tfplan
            tfplan.txt
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
